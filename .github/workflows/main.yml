name: Docker Build and Push to NAS

on:
    push:
        branches: [main]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Check NAS Registry connectivity
              run: |
                  getent ahostsv4 registry.parsons125.in
                  response_code=$(curl --ipv4 --http1.1 --verbose \
                      --connect-timeout 10 --max-time 20 \
                      --output /dev/null --write-out '%{http_code}' \
                      https://registry.parsons125.in/v2/)
                  case "$response_code" in
                      200|401) echo "Registry reachable (HTTP $response_code)" ;;
                      *) echo "::error::Unexpected registry response: HTTP $response_code"; exit 1 ;;
                  esac

            # Login to your Private Registry
            - name: Login to NAS Registry
              run: |
                  echo "${{ secrets.NAS_REGISTRY_PASSWORD }}" | docker login registry.parsons125.in -u "${{ secrets.NAS_REGISTRY_USERNAME }}" --password-stdin

            # Build and Push
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      registry.parsons125.in/pokemon-app:latest

            # Trigger Webhook
            - name: Trigger NAS Redeploy
              run: |
                  curl -sf -X POST "https://webhook.parsons125.in/hooks/redeploy-pokemon-app?token=${{ secrets.DEPLOY_TOKEN }}"
